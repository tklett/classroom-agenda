<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classroom Display</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #111; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #screen {
    display: flex; flex-direction: column; justify-content: center;
    height: 100vh; box-sizing: border-box; padding: 4vmin 6vmin;
  }
  /* clamp(min, preferred, max): guarantees a real minimum size no matter
     the screen's orientation or aspect ratio, instead of purely scaling
     with viewport units (which can shrink further than intended on some
     screens - vmin in particular is pinned to whichever dimension is
     smaller, which doesn't help on a narrow portrait screen). */
  #course-name { font-size: clamp(3rem, 14vmin, 12rem); font-weight: 700; margin: 0 0 0.5em 0; }
  #period-label { font-size: clamp(1.2rem, 4vmin, 2.5rem); color: #9ad; margin: 0 0 1em 0; text-transform: uppercase; letter-spacing: 0.05em; }
  #plan-date { font-size: clamp(1.4rem, 4.5vmin, 3rem); color: #ddd; margin: 0 0 0.6em 0; }
  #plan-note { font-size: clamp(1.1rem, 3vmin, 2rem); color: #999; margin: 0 0 1em 0; font-style: italic; }
  #bullets { font-size: clamp(2rem, 8vmin, 5rem); line-height: 1.5; padding-left: 1.2em; margin: 0; max-width: 90%; overflow-wrap: break-word; }
  #bullets li { margin-bottom: 0.4em; }
  #clock { position: fixed; top: 2vmin; right: 3vmin; font-size: clamp(1.2rem, 2.5vmin, 1.8rem); color: #777; }
  #idle-list { display: flex; flex-direction: column; gap: 1.2em; max-width: 90%; }
  #idle-list div { font-size: clamp(1.8rem, 7vmin, 4rem); overflow-wrap: break-word; }
  #idle-list span { color: #9ad; font-weight: 700; }
  #debug { position: fixed; bottom: 1vmin; left: 1vmin; font-size: 14px; color: #444; font-family: monospace; }
</style>
</head>
<body>
<div id="clock"></div>
<div id="debug"></div>
<div id="screen">
<div id="content">
  <div id="course-name">Loading…</div>
  <div id="period-label"></div>
  <div id="plan-date"></div>
  <div id="plan-note"></div>
  <ul id="bullets"></ul>
  <div id="idle-list" style="display:none;"></div>
</div>
</div>

<script>
const COURSES = [
  { key: "ap-lang-dmacc-comp", name: "AP Lang / DMACC Comp", url: "{{ '/terms/2026-fall/ap-lang-dmacc-comp.html' | relative_url }}" },
  { key: "senior-capstone",    name: "Senior Capstone",       url: "{{ '/terms/2026-fall/senior-capstone.html' | relative_url }}" },
  { key: "ai-literacy",        name: "AI Literacy",           url: "{{ '/terms/2026-fall/ai-literacy.html' | relative_url }}" },
  { key: "dystopian-lit",      name: "Dystopian Literature",  url: "{{ '/terms/2026-fall/dystopian-lit.html' | relative_url }}" },
  { key: "computer-science",   name: "Computer Science",      url: "{{ '/terms/2026-fall/computer-science.html' | relative_url }}" },
];

// Bell schedule, in minutes since midnight. Each entry maps a course key to
// [start, end]. "mwf" covers Mon/Tue/Thu/Fri (same schedule); "wed" is its
// own shorter-period day.
function toMin(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  return h * 60 + m;
}
const SCHEDULE = {
  mtthf: [
    ["ap-lang-dmacc-comp", "9:51", "10:36"],
    ["ap-lang-dmacc-comp", "10:39", "11:24"],
    ["senior-capstone",    "11:51", "12:36"],
    ["ai-literacy",        "12:39", "13:24"],
    ["dystopian-lit",      "13:27", "14:12"],
    ["computer-science",   "14:15", "15:00"],
  ],
  wed: [
    ["ap-lang-dmacc-comp", "9:33", "10:09"],
    ["ap-lang-dmacc-comp", "10:12", "10:48"],
    ["senior-capstone",    "11:08", "11:48"],
    ["ai-literacy",        "11:51", "12:27"],
    ["dystopian-lit",      "12:30", "13:06"],
    ["computer-science",   "13:09", "13:45"],
  ],
};

// One-off adjusted-schedule override: set for a single specific date when
// the school runs a non-standard bell schedule that day (assembly, testing,
// early dismissal, etc.). This does NOT change SCHEDULE above — that stays
// the normal recurring pattern. Update `date` and `periods` each time a new
// adjusted day comes up (day-by-day, per Tom's preference, since weather or
// other disruptions can change things before a day even arrives); a
// non-matching date is simply ignored, so it's safe to leave the last one
// in place until the next adjustment is known.
const SCHEDULE_OVERRIDE = {
  date: "2026-09-25",
  periods: [
    ["ap-lang-dmacc-comp", "9:33", "10:48"],
    ["senior-capstone",    "10:51", "11:48"],
    ["ai-literacy",        "11:51", "12:27"],
    ["dystopian-lit",      "12:30", "13:10"],
    ["computer-science",   "13:13", "13:45"],
  ],
};

function todayISO(now) {
  return now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
}

function currentCourseKey(now) {
  let todaySchedule;
  if (SCHEDULE_OVERRIDE.date === todayISO(now)) {
    todaySchedule = SCHEDULE_OVERRIDE.periods;
  } else {
    const day = now.getDay(); // 0=Sun ... 3=Wed
    todaySchedule = day === 3 ? SCHEDULE.wed : SCHEDULE.mtthf;
  }
  const nowMin = now.getHours() * 60 + now.getMinutes();
  for (const [key, start, end] of todaySchedule) {
    if (nowMin >= toMin(start) && nowMin < toMin(end)) return key;
  }
  return null;
}

// Cache of fetched "Next Class" content per course, refreshed periodically.
let cache = {};

async function fetchNextClass(course) {
  try {
    const res = await fetch(course.url, { cache: "no-store" });
    const html = await res.text();
    const doc = new DOMParser().parseFromString(html, "text/html");
    const heading = doc.getElementById("next-class");
    if (!heading) return null;
    let dateLine = "", note = "", bullets = [];
    let el = heading.nextElementSibling;
    // First paragraph after the heading is "**date** — *note*"
    if (el && el.tagName === "P") {
      const strong = el.querySelector("strong");
      const em = el.querySelector("em");
      dateLine = strong ? strong.textContent : "";
      note = em ? em.textContent : "";
      el = el.nextElementSibling;
    }
    if (el && el.tagName === "UL") {
      bullets = Array.from(el.querySelectorAll("li")).map(li => li.innerHTML);
    }
    return { dateLine, note, bullets };
  } catch (e) {
    return null;
  }
}

async function refreshCache() {
  for (const course of COURSES) {
    cache[course.key] = await fetchNextClass(course);
  }
}

function renderCourse(course) {
  const data = cache[course.key];
  document.getElementById("idle-list").style.display = "none";
  document.getElementById("course-name").style.display = "";
  document.getElementById("plan-date").style.display = "";
  document.getElementById("plan-note").style.display = "";
  document.getElementById("bullets").style.display = "";

  document.getElementById("course-name").textContent = course.name;
  document.getElementById("period-label").textContent = "Now Meeting";

  if (!data || !data.bullets.length) {
    document.getElementById("plan-date").textContent = "";
    document.getElementById("plan-note").textContent = "Nothing posted yet — check back soon.";
    document.getElementById("bullets").innerHTML = "";
    return;
  }
  document.getElementById("plan-date").textContent = data.dateLine;
  document.getElementById("plan-note").textContent = data.note;
  document.getElementById("bullets").innerHTML = data.bullets.map(b => `<li>${b}</li>`).join("");
}

let idleIndex = 0;
function renderIdle() {
  document.getElementById("course-name").style.display = "none";
  document.getElementById("plan-date").style.display = "none";
  document.getElementById("plan-note").style.display = "none";
  document.getElementById("bullets").style.display = "none";
  document.getElementById("period-label").textContent = "Coming Up Today";

  const course = COURSES[idleIndex % COURSES.length];
  idleIndex++;
  const data = cache[course.key];
  const list = document.getElementById("idle-list");
  list.style.display = "flex";
  const bulletText = data && data.bullets.length
    ? data.bullets[0]
    : "Nothing posted yet";
  list.innerHTML = `<div><span>${course.name}</span> — ${bulletText}</div>`;
}

// If the rendered content is taller than the available screen, shrink it
// (via Chrome's non-standard `zoom` - fine here since this only ever runs
// in Chrome) rather than letting it clip against `overflow: hidden`. Only
// ever shrinks, never enlarges past the CSS-defined size.
function fitToScreen() {
  const screen = document.getElementById("screen");
  const content = document.getElementById("content");
  content.style.zoom = 1;
  const style = getComputedStyle(screen);
  const availableHeight = screen.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
  const contentHeight = content.scrollHeight;
  if (contentHeight > availableHeight) {
    const ratio = Math.max((availableHeight / contentHeight) * 0.95, 0.3);
    content.style.zoom = ratio;
  }
}

function tick() {
  const now = new Date();
  document.getElementById("clock").textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const key = currentCourseKey(now);
  if (key) {
    const course = COURSES.find(c => c.key === key);
    renderCourse(course);
  } else {
    renderIdle();
  }
  requestAnimationFrame(fitToScreen);
}

refreshCache().then(tick);
setInterval(tick, 15000);        // advance idle rotation / recheck period every 15s
setInterval(refreshCache, 5 * 60 * 1000); // re-fetch live content every 5 min

// Keep the screen awake while this page is open. This is a request, not a
// guarantee - some Chrome OS device policies can override it - so also set
// the Chromebook's own display-sleep setting to "Never" (Settings > Device
// > Power) as a backstop.
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ("wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
    }
  } catch (e) {
    // Wake Lock can be refused (e.g. battery saver, unsupported context) -
    // fail silently, the page still works, it just may not stay awake.
  }
}
requestWakeLock();
// A wake lock is released automatically if the tab is hidden; re-acquire it
// when the page becomes visible again.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") requestWakeLock();
});

// Temporary diagnostic: shows the actual CSS viewport size and device
// pixel ratio in the corner, so a screen that's rendering unexpectedly
// small/cramped can be diagnosed from a photo instead of guessed at.
// Safe to remove once the sizing issue is confirmed fixed.
function updateDebug() {
  document.getElementById("debug").textContent =
    `${window.innerWidth}x${window.innerHeight} @ dpr=${window.devicePixelRatio}`;
}
updateDebug();
window.addEventListener("resize", updateDebug);
</script>
</body>
</html>
